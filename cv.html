<!doctype html>
<html lang="en">

<title>Yamina Dib | CV</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  :root { --bg:#21242E; --panel:#2B2F3B; --line:#444A5A; --fg:#F8F5EC; --muted:#C9C5B8; --ochre:#B5772B; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--ochre); font: 600 1.2rem Georgia, serif; }
  .name { display: block; font: 600 1rem Georgia, serif; }
  .role { display: block; font-size: 0.75rem; color: var(--muted); }
  nav { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 0.88rem; font-weight: 500; text-decoration: none; }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
  .btn:focus-visible, .brand:focus-visible, .fallback a:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .fallback { margin: 0; padding: 10px 20px; font-size: 0.85rem; color: var(--muted); }
  .fallback a { color: var(--fg); }
</style>
<script data-goatcounter="https://yamina-portfolio.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html" aria-label="Yamina Dib, portfolio home">
    <span class="mark" aria-hidden="true">Y</span>
    <span><span class="name">Yamina Dib</span><span class="role">Instructional Design &amp; Curriculum Development</span></span>
  </a>
  <nav aria-label="Document">
    <a class="btn ghost" href="index.html">Back to portfolio</a>
    <a class="btn" href="downloads/Yamina%20Dib%20Instructional%20Designer%20CV.pdf" download>Download PDF</a>
  </nav>
</header>
<iframe src="downloads/Yamina%20Dib%20Instructional%20Designer%20CV.pdf" title="Yamina Dib, CV"></iframe>
<p class="fallback">If the document does not appear, <a href="downloads/Yamina%20Dib%20Instructional%20Designer%20CV.pdf">open the PDF directly</a>.</p>
</body>
